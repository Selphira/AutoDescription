debug_variable = 0

// Inclure les objets qui n'ont aucune description à la base
include_items_without_description = 0

// Inclure les objets qui ne peuvent être bougés (normalement non accessibles au joueur)
include_non_moveable_items = 0

// Inclure les objets maudits
include_cursed_items = 1

// Modifier la description des objets dans les fichiers du jeu
alter_item_files = 1

// Inclure les sorts qui n'ont aucune description à la base
include_spells_without_description = 0

// Inclure les sorts qui n'ont aucun nom à la base
include_spells_without_name = 0

// Modifier la description des sorts dans les fichiers du jeu
alter_spell_files = 1

// Ajoute la section PARAMÈTRES à la description des sorts.
add_statistics_section_to_spell_description = 0

// Modifie la façon dont les bonus/malus à la CA sont affichés ("+2" deviendra "Bonus de 2", "-1" de deviendra "Malus de 1")
armor_class_show_bonus_malus = 0

// Affiche le niveau d'enchantement d'une arme uniquement s'il est différent du TAC0
show_weapon_enchantment_if_different_thac0 = 1

// Utiliser la version très courte de certains effets, comme "Hâte", "Hâte améliorée", "Non-Détection"
use_short_effect_description = 0

// Affiche si l'armure permet de lancer des sorts profanes, et non plus si l'armure empêche de lancer des sorts profanes
armor_show_allows_to_cast_spells = 1

// Réduire la description d'effets similaires
enable_shrinkage = 1

// Réduire la description des résistances
shrink_resistances = 1

// Réduire la description des jets de sauvegarde
shrink_saves_throws = 1

// Réduire la description des caractéristiques du personnage
shrink_abilities = 1

// Réduire la description des compétences de voleur
shrink_thief_skills = 1

// Réduire la description des attributs des armes
shrink_weapon_attributes = 1

// Réduire la description des immunités et des dissipations en lien avec le même effet se trouvant sur le même objet
shrink_cure_with_immunities = 1

// Réduire la description des immunités en une seule ligne
shrink_immunities_single_line = 1

// Réduire les effets modifiant la classe d'armure des armures en une seule ligne d'attribut.
shrink_class_armor = 1

// Regroupe les effets ayant la même probabilité de s'activer en même temps, en gérant les chevauchements.
use_complex_grouping_of_probability_ranges = 0

// Affiche dans le error-all.log les immunités incomplètes : celles protégeant contre un opcode mais pas contre les sorts utilisant ce même opcode
show_lack_immunity = 0

// Développement : affiche dans le error.log les erreurs survenues dans les macros optionnelles des opcodes, qui sont ignorées silencieusement (le traitement continue comme sans cette option)
show_swallowed_errors = 0

// Développement : écrit dans AutoDescription/log/*-dump.txt une ligne par objet ou sort traité (description générée, ignoré, échec), pour comparer deux versions du mod
regression_dump = 0

// Développement : moteur de génération des descriptions. 0 : ancien moteur (lib/) ; 1 : nouveau moteur (new-lib/) seul ; 2 : les deux, description de l'ancien enregistrée, écarts écrits dans AutoDescription/log/*-compare.txt ; 3 : les deux, description du nouveau enregistrée, écarts écrits. Avec le nouveau moteur (1 et 3), une ressource qu'il ne sait pas encore décrire n'est pas modifiée
description_engine = 0

// Développement, nouveau moteur : écrit dans AutoDescription/log/*-effects.txt les effets lus de chaque objet ou sort (valeurs brutes), quand description_engine vaut 1, 2 ou 3
AD_EFFECTS_DUMP = 0

// Nouveau moteur : mêmes rôles et mêmes valeurs par défaut que enable_shrinkage,
// shrink_class_armor et armor_class_show_bonus_malus de l'ancien moteur ; leur donner les mêmes
// valeurs pour comparer les deux moteurs.
// Réduire la description d'effets similaires
AD_ENABLE_SHRINKAGE = 1
// Réduire les effets modifiant la classe d'armure en une seule ligne
AD_SHRINK_CLASS_ARMOR = 1
// Réduire la description des caractéristiques du personnage (même rôle que shrink_abilities)
AD_SHRINK_ABILITIES = 1
// Réduire la description des jets de sauvegarde (même rôle que shrink_saves_throws)
AD_SHRINK_SAVES_THROWS = 1
// Réduire la description des résistances (même rôle que shrink_resistances)
AD_SHRINK_RESISTANCES = 1
// Réduire la description des compétences de voleur (même rôle que shrink_thief_skills)
AD_SHRINK_THIEF_SKILLS = 1
// Réduire les immunités et les dissipations liées au même effet (même rôle que shrink_cure_with_immunities)
AD_SHRINK_CURE_WITH_IMMUNITIES = 1
// Réduire les immunités en une seule ligne (même rôle que shrink_immunities_single_line)
AD_SHRINK_IMMUNITIES_SINGLE_LINE = 1
// Afficher si l'armure permet de lancer des sorts profanes, plutôt que si elle l'empêche (même rôle que armor_show_allows_to_cast_spells)
AD_ARMOR_SHOW_ALLOWS_TO_CAST_SPELLS = 1
// Réduire la description des attributs des armes (même rôle que shrink_weapon_attributes)
AD_SHRINK_WEAPON_ATTRIBUTES = 1
// Afficher le niveau d'enchantement d'une arme uniquement s'il est différent du TAC0 (même rôle que show_weapon_enchantment_if_different_thac0)
AD_SHOW_WEAPON_ENCHANTMENT_IF_DIFFERENT_THAC0 = 1
// Afficher les modificateurs de CA sous la forme « Bonus de 2 », « Malus de 1 » au lieu de « +2 », « -1 »
AD_ARMOR_CLASS_SHOW_BONUS_MALUS = 0
